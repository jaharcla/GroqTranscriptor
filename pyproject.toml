[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courseai-lectures"
version = "0.3.0"
description = "Local Buzz transcript ingestion into Notion, with optional Groq transcript review"
requires-python = ">=3.11"
dependencies = ["imageio-ffmpeg>=0.6,<1", "httpx>=0.27,<1", "watchdog>=4,<7", "python-dotenv>=1,<2", "PyYAML>=6,<7", "filelock>=3.13,<4", "sounddevice>=0.5,<1", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
courseai-lectures = "courseai_lectures.cli:main"
courseai-listener = "courseai_lectures.listener_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
courseai_lectures = ["*.md"]
